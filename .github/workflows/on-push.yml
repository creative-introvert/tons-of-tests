name: on-push

on:
  push:
    branches-ignore:
    - 'master'

jobs:
  lint:
    if: |
      !contains(fromJson('["ci skip","skip ci"]'), github.event.head_commit.message) &&
      !startsWith(github.event.head_commit.message, 'docs')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: lint
        run: pnpm run check

  test:
    if: |
      !contains(fromJson('["ci skip","skip ci"]'), github.event.head_commit.message) &&
      !startsWith(github.event.head_commit.message, 'docs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: test
        run: pnpm run test

  build:
    if: |
      !contains(fromJson('["ci skip","skip ci"]'), github.event.head_commit.message) &&
      !startsWith(github.event.head_commit.message, 'docs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: build
        run: pnpm run build
      - name: typecheck
        run: pnpm exec tsc --build tsconfig.json tsconfig.typecheck.json
