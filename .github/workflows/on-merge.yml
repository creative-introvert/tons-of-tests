name: on-merge

on:
  push:
    branches:
    - 'master'

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  publish:
    timeout-minutes: 10
    if: |
      !contains(fromJson('["ci skip","skip ci"]'), github.event.head_commit.message) &&
      !startsWith(github.event.head_commit.message, 'docs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: create and publish versions
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm run changesets-version
          commit-message: "chore: publish"
          pr-title: "chore: publish"
          publish-script: pnpm run changesets-publish
          github-token: ${{ secrets.GITHUB_TOKEN }}
